<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Widget</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- removed code can be found in the other .html file -->

    <!-- Center Countdown Area -->
    <div class="widget-wrapper">
        <div class="widget-layout">
            <!-- Displayed live remaining time -->
            <div class="time-digits" id="timeDigits">--:--:--</div>

            <!-- Target sentence layout -->
            <div class="target-group">
                <span>until</span>
                <form id="timerForm" style="display:inline;" onsubmit="return false;">
                    <div class="time-input-group">
                        <input type="text" id="inputHour" class="time-field" placeholder="HH" maxlength="2" inputmode="numeric" autocomplete="off">
                        <span class="time-separator">:</span>
                        <input type="text" id="inputMinute" class="time-field" placeholder="MM" maxlength="2" inputmode="numeric" autocomplete="off">
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Bottom Settings Bar for Thresholds & Beeps -->
    <div class="settings-bar">
        <!-- Threshold 1: Green / Safe -->
        <div class="threshold-group">
            <div class="bell-container" style="color: var(--color-safe);">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M12 2a2 2 0 0 0-2 2v.09A7.002 7.002 0 0 0 4 11v5l-2 2v1h20v-1l-2-2v-5a7.002 7.002 0 0 0-6-6.91V4a2 2 0 0 0-2-2zm0 18a3 3 0 0 1-3-3h6a3 3 0 0 1-3 3z"/></svg>
            </div>
            <input type="text" id="threshold1Field" class="threshold-field" placeholder="30" maxlength="3" inputmode="numeric" autocomplete="off">
        </div>

        <!-- Threshold 2: Yellow / Warning -->
        <div class="threshold-group">
            <div class="bell-container" style="color: var(--color-warning);">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M12 2a2 2 0 0 0-2 2v.09A7.002 7.002 0 0 0 4 11v5l-2 2v1h20v-1l-2-2v-5a7.002 7.002 0 0 0-6-6.91V4a2 2 0 0 0-2-2zm0 18a3 3 0 0 1-3-3h6a3 3 0 0 1-3 3z"/></svg>
            </div>
            <input type="text" id="threshold2Field" class="threshold-field" placeholder="15" maxlength="3" inputmode="numeric" autocomplete="off">
        </div>

        <!-- Threshold 3: Red / Danger -->
        <div class="threshold-group">
            <div class="bell-container" style="color: var(--color-danger);">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M12 2a2 2 0 0 0-2 2v.09A7.002 7.002 0 0 0 4 11v5l-2 2v1h20v-1l-2-2v-5a7.002 7.002 0 0 0-6-6.91V4a2 2 0 0 0-2-2zm0 18a3 3 0 0 1-3-3h6a3 3 0 0 1-3 3z"/></svg>
            </div>
            <input type="text" id="threshold3Field" class="threshold-field" placeholder="5" maxlength="3" inputmode="numeric" autocomplete="off">
        </div>
    </div>

    <!-- Audio Elements for Local Beep Files -->
    <audio id="beep0" src="beep0.mp3" preload="auto"></audio>
    <audio id="beep1" src="beep1.mp3" preload="auto"></audio>
    <audio id="beep2" src="beep2.mp3" preload="auto"></audio>
    <audio id="beep3" src="beep3.mp3" preload="auto"></audio>

    <script src="simple.js"></script>
</body>
</html>
